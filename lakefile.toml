name = "skinock"
version = "0.1.0"
defaultTargets = ["Nock2Ski"]

# Both dependencies are required by path (PLAN.md §8, M0). lean-nock is on the
# `lean-4.31` branch so that all three packages share one toolchain.
[[require]]
name = "Ski"
path = "../lean-ski"

[[require]]
name = "Nock"
path = "../../lean-nock"

[[lean_lib]]
name = "Nock2Ski"

[[lean_exe]]
name = "normcheck"
root = "bench.NormCheck"

[[lean_exe]]
name = "nockstatement"
root = "bench.NockStatement"

[[lean_exe]]
name = "nockpred"
root = "bench.NockPred"

[[lean_exe]]
name = "nockprobe"
root = "bench.NockProbe"
